apiVersion: apps/v1
kind: Deployment

metadata:
  name: event-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: event

  template:
    metadata:
      labels:
        app: event

    spec:
      containers:
      - name: event-app
        image: harini2926/event-app:latest
        ports:
        - containerPort: 5000
